name: terraform

on:
  pull_request:
    paths: ["terraform/**"]
  workflow_dispatch:
    inputs:
      action:
        description: "plan | apply | destroy"
        required: true
        default: plan

permissions:
  contents: read
  id-token: write

env:
  TF_DIR: terraform

jobs:
  terraform:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.WIF_PROVIDER }}
          service_account: ${{ secrets.WIF_SERVICE_ACCOUNT }}

      - uses: hashicorp/setup-terraform@v3

      - name: Init
        working-directory: ${{ env.TF_DIR }}
        run: terraform init -backend-config="bucket=${{ secrets.TF_STATE_BUCKET }}"

      - name: Validate
        working-directory: ${{ env.TF_DIR }}
        run: terraform fmt -check && terraform validate

      - name: Plan
        working-directory: ${{ env.TF_DIR }}
        run: terraform plan -input=false

      - name: Apply
        if: github.event_name == 'workflow_dispatch' && inputs.action == 'apply'
        working-directory: ${{ env.TF_DIR }}
        run: terraform apply -auto-approve -input=false

      - name: Destroy
        if: github.event_name == 'workflow_dispatch' && inputs.action == 'destroy'
        working-directory: ${{ env.TF_DIR }}
        run: terraform destroy -auto-approve -input=false
