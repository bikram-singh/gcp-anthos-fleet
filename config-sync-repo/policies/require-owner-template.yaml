apiVersion: templates.gatekeeper.sh/v1
kind: ConstraintTemplate
metadata:
  name: k8srequireowner
spec:
  crd:
    spec:
      names:
        kind: K8sRequireOwner
      validation:
        openAPIV3Schema:
          type: object
          properties:
            label:
              type: string
  targets:
    - target: admission.k8s.gatekeeper.sh
      rego: |
        package k8srequireowner

        violation[{"msg": msg}] {
          required := input.parameters.label
          not input.review.object.metadata.labels[required]
          msg := sprintf("%v %v is missing the required label '%v'", [input.review.kind.kind, input.review.object.metadata.name, required])
        }